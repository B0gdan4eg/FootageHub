version: '3.8'

services:
  # Shared PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: footagehub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - footagehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MediaBot - Envato/Freepik/Motion Array downloads
  media-bot:
    image: ghcr.io/b0gdan4eg/footagehub-media-bot:latest
    container_name: footagehub-media-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN=${ADMIN}
      - DISPLAY=:99
      # WebPay
      - WEBPAY_RESOURCE_ID=${WEBPAY_RESOURCE_ID}
      - WEBPAY_API_KEY=${WEBPAY_API_KEY}
      - WEBPAY_SECRET_KEY=${WEBPAY_SECRET_KEY}
      - WEBPAY_SIGNING_KEY=${WEBPAY_SIGNING_KEY}
      - WEBPAY_SANDBOX=${WEBPAY_SANDBOX:-false}
      # CryptoBot
      - CRYPTO_BOT_API_KEY=${CRYPTO_BOT_API_KEY}
      # Channel
      - CHANNEL_ID=${CHANNEL_ID:-@footagehub_channel}
      - CHANNEL_BONUS_CREDITS=${CHANNEL_BONUS_CREDITS:-2}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - footagehub-network
    ports:
      - "8000:8000"  # WebPay webhooks
      - "8443:8443"  # Webhook server

  # AIBot - AI content generation via Kie.ai
  ai-bot:
    image: ghcr.io/b0gdan4eg/footagehub-ai-bot:latest
    container_name: footagehub-ai-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BOT_TOKEN=${AI_BOT_TOKEN}
      - ADMIN=${ADMIN}
      # AI Providers
      - KIE_AI_API_KEY=${KIE_AI_API_KEY}
      # Channel
      - CHANNEL_ID=${CHANNEL_ID:-@footagehub_channel}
    networks:
      - footagehub-network

  # Web API — FastAPI backend for web interface
  web-api:
    image: ghcr.io/b0gdan4eg/footagehub-web-api:latest
    container_name: footagehub-web-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMSC_LOGIN=${SMSC_LOGIN}
      - SMSC_PASSWORD=${SMSC_PASSWORD}
      - SMSC_SENDER=${SMSC_SENDER:-FOOTAGE}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://envato-freepik-download.store}
      - KIE_AI_API_KEY=${KIE_AI_API_KEY}
      - WEBPAY_RESOURCE_ID=${WEBPAY_RESOURCE_ID}
      - WEBPAY_SIGNING_KEY=${WEBPAY_SIGNING_KEY}
      - CRYPTO_BOT_API_KEY=${CRYPTO_BOT_API_KEY}
    networks:
      - footagehub-network
    ports:
      - "8080:8080"

  # Frontend — Next.js
  frontend:
    image: ghcr.io/b0gdan4eg/footagehub-frontend:latest
    container_name: footagehub-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://envato-freepik-download.store/api
    networks:
      - footagehub-network
    ports:
      - "3000:3000"

volumes:
  postgres_data:

networks:
  footagehub-network:
    driver: bridge
