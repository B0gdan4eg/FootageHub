version: '3.8'

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Shared PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: footagehub-db
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - footagehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MediaBot - Envato/Freepik/Motion Array downloads
  media-bot:
    image: ${MEDIA_BOT_IMAGE:-ghcr.io/b0gdan4eg/footagehub-media-bot:latest}
    container_name: footagehub-media-bot
    logging: *bounded-logging
    restart: unless-stopped
    init: true
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN=${ADMIN}
      - DISPLAY=:99
      - PROVIDER_COOKIE_ROOT=/var/lib/footagehub/provider-cookies
      - FREEPIK_HTTP_ENABLED=${FREEPIK_HTTP_ENABLED:-0}
      - FREEPIK_STATE_DIR=/var/lib/footagehub/freepik
      - ENVATO_HTTP_ENABLED=${ENVATO_HTTP_ENABLED:-0}
      - ENVATO_STATE_DIR=/var/lib/footagehub/envato
      - ENVATO_BROWSER_HTTP_ENABLED=${ENVATO_BROWSER_HTTP_ENABLED:-0}
      - ENVATO_BROWSER_HTTP_STATE_DIR=/var/lib/footagehub/envato/browser-cache
      # WebPay
      - WEBPAY_RESOURCE_ID=${WEBPAY_RESOURCE_ID}
      - WEBPAY_API_KEY=${WEBPAY_API_KEY}
      - WEBPAY_SECRET_KEY=${WEBPAY_SECRET_KEY}
      - WEBPAY_SIGNING_KEY=${WEBPAY_SIGNING_KEY}
      - WEBPAY_SANDBOX=${WEBPAY_SANDBOX:-false}
      # CryptoBot
      - CRYPTO_BOT_API_KEY=${CRYPTO_BOT_API_KEY}
      # Channel
      - CHANNEL_ID=${CHANNEL_ID:-@footagehub_channel}
      - CHANNEL_BONUS_CREDITS=${CHANNEL_BONUS_CREDITS:-2}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - freepik_session:/var/lib/footagehub/freepik
      - envato_session:/var/lib/footagehub/envato
      - envato_browser_profiles:/app/media_bot/utils/envato_utils/.profiles
      - ./provider-cookies:/var/lib/footagehub/provider-cookies
      - ./browser-profiles/freepik:/app/media_bot/utils/freepik_utils/.profile
    networks:
      - footagehub-network
    ports:
      - "127.0.0.1:8000:8000"  # WebPay webhooks
      - "127.0.0.1:8443:8443"  # Nginx webhooks; internal API stays on Docker network

  # AIBot - AI content generation via Kie.ai
  ai-bot:
    image: ${AI_BOT_IMAGE:-ghcr.io/b0gdan4eg/footagehub-ai-bot:latest}
    container_name: footagehub-ai-bot
    logging: *bounded-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BOT_TOKEN=${AI_BOT_TOKEN}
      - ADMIN=${ADMIN}
      # AI Providers
      - KIE_AI_API_KEY=${KIE_AI_API_KEY}
      # Channel
      - CHANNEL_ID=${CHANNEL_ID:-@footagehub_channel}
    networks:
      - footagehub-network

  # Web API — FastAPI backend for web interface
  web-api:
    image: ${WEB_API_IMAGE:-ghcr.io/b0gdan4eg/footagehub-web-api:latest}
    container_name: footagehub-web-api
    logging: *bounded-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BOT_TOKEN=${BOT_TOKEN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMSC_LOGIN=${SMSC_LOGIN}
      - SMSC_PASSWORD=${SMSC_PASSWORD}
      - SMSC_SENDER=${SMSC_SENDER:-FOOTAGE}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://envato-freepik-download.store}
      - KIE_AI_API_KEY=${KIE_AI_API_KEY}
      - WEBPAY_RESOURCE_ID=${WEBPAY_RESOURCE_ID}
      - WEBPAY_SIGNING_KEY=${WEBPAY_SIGNING_KEY}
      - CRYPTO_BOT_API_KEY=${CRYPTO_BOT_API_KEY}
      - MEDIA_BOT_INTERNAL_URL=http://media-bot:8443
    networks:
      - footagehub-network
    ports:
      - "127.0.0.1:8080:8080"

  # Frontend — Next.js
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/b0gdan4eg/footagehub-frontend:latest}
    container_name: footagehub-frontend
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://envato-freepik-download.store/api
      - GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}
      - POSTHOG_PROJECT_TOKEN=${POSTHOG_PROJECT_TOKEN:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
    networks:
      - footagehub-network
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  freepik_session:
  envato_session:
  envato_browser_profiles:

networks:
  footagehub-network:
    driver: bridge
