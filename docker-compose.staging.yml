# ============================================
# STAGING DOCKER COMPOSE CONFIGURATION
# ============================================
# Use this for staging/testing environment
# Command: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
# ============================================

services:
  # Shared PostgreSQL database (Staging)
  postgres:
    image: postgres:15-alpine
    container_name: footagehub-staging-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: footagehub_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./backups/staging:/backups
    ports:
      - "5433:5432"  # Different port to avoid conflict with production
    networks:
      - footagehub-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "environment=staging"

  # MediaBot - Envato/Freepik/Motion Array downloads (Staging)
  media-bot:
    build:
      context: .
      dockerfile: docker/media-bot.Dockerfile
    container_name: footagehub-staging-media-bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/footagehub_staging
      - BOT_TOKEN=${MEDIA_BOT_TOKEN}
      - ADMIN=${ADMIN}
      - DISPLAY=:99
      # WebPay (SANDBOX MODE)
      - WEBPAY_RESOURCE_ID=${WEBPAY_RESOURCE_ID}
      - WEBPAY_API_KEY=${WEBPAY_API_KEY}
      - WEBPAY_SECRET_KEY=${WEBPAY_SECRET_KEY}
      - WEBPAY_SIGNING_KEY=${WEBPAY_SIGNING_KEY}
      - WEBPAY_SANDBOX=${WEBPAY_SANDBOX:-true}
      # CryptoBot (TEST MODE)
      - CRYPTO_BOT_API_KEY=${CRYPTO_BOT_API_KEY}
      # Channel
      - CHANNEL_ID=${CHANNEL_ID:-@footagehub_staging_channel}
      - CHANNEL_BONUS_CREDITS=${CHANNEL_BONUS_CREDITS:-5}
      # Debug settings
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
    volumes:
      - ./media_bot:/app/media_bot
      - ./shared:/app/shared
      - ./envato_utils:/app/envato_utils
      - ./freepik_utils:/app/freepik_utils
      - ./motion_utils:/app/motion_utils
      - ./cookies:/app/cookies
      - ./debug_screenshots/staging:/app/debug_screenshots
      - staging_logs:/app/logs
    networks:
      - footagehub-staging-network
    restart: unless-stopped
    ports:
      - "8001:8000"  # Different port to avoid conflict with production
    labels:
      - "environment=staging"
      - "service=media-bot"
    # Resource limits for staging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # AIBot - AI content generation via Kie.ai (Staging)
  ai-bot:
    build:
      context: .
      dockerfile: docker/ai-bot.Dockerfile
    container_name: footagehub-staging-ai-bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/footagehub_staging
      - AI_BOT_TOKEN=${AI_BOT_TOKEN}
      - ADMIN=${ADMIN}
      # AI Providers
      - KIE_AI_API_KEY=${KIE_AI_API_KEY}
      # Channel
      - CHANNEL_ID=${CHANNEL_ID:-@footagehub_staging_channel}
      # Debug settings
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      # Feature flags
      - ENABLE_AI_GENERATION=${ENABLE_AI_GENERATION:-true}
    volumes:
      - ./ai_bot:/app/ai_bot
      - ./shared:/app/shared
      - ./ai_generations/staging:/app/ai_generations
      - staging_ai_logs:/app/logs
    networks:
      - footagehub-staging-network
    restart: unless-stopped
    labels:
      - "environment=staging"
      - "service=ai-bot"
    # Resource limits for staging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_staging_data:
    name: footagehub_staging_db_data
  staging_logs:
    name: footagehub_staging_logs
  staging_ai_logs:
    name: footagehub_staging_ai_logs

networks:
  footagehub-staging-network:
    driver: bridge
    name: footagehub-staging-network
