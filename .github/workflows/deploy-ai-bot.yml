name: Build and Deploy AI Bot to VPS via GHCR

on:
  push:
    branches: [ master, ai-bot-dev ]
    paths:
      - 'ai_bot/**'
      - 'shared/**'
      - 'docker/ai-bot.Dockerfile'
      - 'requirements/base.txt'
      - 'requirements/ai-bot.txt'
      - '.github/workflows/deploy-ai-bot.yml'

jobs:
  deploy-ai-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and push AI Bot Docker image
      run: |
        docker build -f docker/ai-bot.Dockerfile -t ghcr.io/b0gdan4eg/footagehub-ai:latest .
        docker push ghcr.io/b0gdan4eg/footagehub-ai:latest

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        printf "%s\n" "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy AI Bot on VPS
      run: |
        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "cd /opt/my_bot && \
           docker compose pull ai-bot && \
           docker compose up -d ai-bot && \
           docker image prune -af"
