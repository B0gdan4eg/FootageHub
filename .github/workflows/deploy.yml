name: Build and Deploy to VPS via GHCR

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t ghcr.io/b0gdan4eg/footagehub:latest .
        docker push ghcr.io/b0gdan4eg/footagehub:latest

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy on VPS
      run: |
        ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
        docker login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GHCR_TOKEN }}'
        docker pull ghcr.io/${{ github.repository_owner }}/my-tg-bot:latest
        docker compose -f /opt/my_bot/docker-compose.yml up -d
        EOF
