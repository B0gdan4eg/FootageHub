name: CI and Production Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: footagehub-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: footagehub_release_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d footagehub_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/footagehub_release_test
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/footagehub_release_test
      JWT_SECRET_KEY: ci-test-key-never-use-in-production-123456
      BOT_TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: pip install -r requirements/web-api.txt -r requirements/media-bot.txt pytest==7.4.4 pytest-asyncio==0.23.3 aiosqlite pyyaml
      - name: Security and downloader regression tests
        run: pytest tests/unit/web_api tests/unit/media_bot -q -o addopts=''
      - name: Compile application sources
        run: python -m compileall -q web_api shared media_bot ai_bot scripts/deploy_release.py
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          node --test tests/*.test.cjs
          npx tsc --noEmit
          npm run build
      - name: Validate compose configuration
        env:
          POSTGRES_USER: botuser
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: botdb
          ADMIN: '1'
        run: |
          touch .env
          docker compose config --quiet

  legacy-audit:
    # Existing suite imports removed bonus APIs. Keep the debt visible while the
    # production gate runs the tested security/downloader suite above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements/dev.txt -r requirements/web-api.txt -r requirements/media-bot.txt aiosqlite
      - name: Existing formatting audit
        continue-on-error: true
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          JWT_SECRET_KEY: ci-test-key-never-use-in-production-123456
        run: |
          black --check shared media_bot ai_bot tests
      - name: Full legacy suite audit
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          JWT_SECRET_KEY: ci-test-key-never-use-in-production-123456
        run: pytest tests -q -o addopts=''

  build:
    needs: release-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [media-bot, ai-bot, web-api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build tested image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/b0gdan4eg/footagehub-${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=https://envato-freepik-download.store/api
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record immutable image
        if: github.event_name != 'pull_request'
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p image-manifest
          printf '%s' "ghcr.io/b0gdan4eg/footagehub-${SERVICE}@${DIGEST}" > "image-manifest/${SERVICE}.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.service }}
          path: image-manifest/*.txt

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: image-manifest
      - name: Prepare release manifest
        env:
          REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          images = {p.stem: p.read_text().strip() for p in Path('image-manifest').glob('*.txt')}
          Path('release.json').write_text(json.dumps({'revision': os.environ['REVISION'], 'images': images}))
          PY
      - name: Configure verified SSH connection
        env:
          VPS_KEY: ${{ secrets.VPS_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy exact tested release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REVISION: ${{ github.sha }}
        run: |
          incoming="/opt/my_bot/.incoming/$REVISION"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$incoming'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes docker-compose.yml scripts/deploy_release.py release.json "$VPS_USER@$VPS_HOST:$incoming/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "python3 '$incoming/deploy_release.py' --incoming '$incoming'"
