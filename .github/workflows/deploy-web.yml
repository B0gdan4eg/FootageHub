name: Build and Deploy Web (API + Frontend)

on:
  push:
    branches: [ master ]
    paths:
      - 'web_api/**'
      - 'shared/**'
      - 'frontend/**'
      - 'docker/web-api.Dockerfile'
      - 'docker/frontend.Dockerfile'
      - 'requirements/web-api.txt'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build-web-api:
    name: Build Web API Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Web API
        run: |
          docker build -f docker/web-api.Dockerfile -t ghcr.io/b0gdan4eg/footagehub-web-api:latest .
          docker push ghcr.io/b0gdan4eg/footagehub-web-api:latest

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Frontend
        run: |
          docker build \
            -f docker/frontend.Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://envato-freepik-download.store/api \
            -t ghcr.io/b0gdan4eg/footagehub-frontend:latest .
          docker push ghcr.io/b0gdan4eg/footagehub-frontend:latest

  deploy:
    name: Deploy Web to VPS
    runs-on: ubuntu-latest
    needs: [build-web-api, build-frontend]
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/my_bot && \
             docker compose pull web-api frontend && \
             docker compose run --rm web-api alembic upgrade head && \
             docker compose up -d web-api frontend && \
             docker image prune -af"
